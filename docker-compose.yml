services:
  queueDB:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
  bot:
    build: .
    depends_on:
      - queueDB
    env_file:
      - .env
    command: python -m bot.app

volumes:
  db_data: